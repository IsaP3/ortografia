function goHome(){session=null;screen='home';render();window.scrollTo(0,0);}
function renderHome(){
$('#app').innerHTML=`<section class="hero"><div class="hero-copy"><span class="eyebrow"><span class="tiny-dot"></span>JUEGO LIBRE</span><h1>Cada palabra<br>es una <em>pista.</em></h1><p>Elige un bloque y un nivel. Escribe, comprueba la tanda y corrige lo que necesite otra oportunidad.</p><div class="hero-meta"><span>9 bloques</span><span>4 niveles</span><span>A tu ritmo</span></div></div><aside class="session-card free-options"><div class="case-stamp">PREPARA TU PARTIDA</div><div class="session-heading">Hoy eliges tú.</div><p>Una partida nueva cada vez.</p><label for="rounds">Tamaño de la tanda</label><select id="rounds" data-setting="rounds">${[6,10,15].map(n=>`<option value="${n}" ${settings.rounds===n?'selected':''}>${n===6?'Breve':n===10?'Habitual':'Larga'} · hasta ${n} palabras</option>`).join('')}</select><label for="mixed-level">Nivel para la tanda mixta</label><select id="mixed-level" data-setting="mixedLevel">${[1,2,3,4].map(l=>`<option value="${l}" ${settings.mixedLevel===l?'selected':''}>Nivel ${l}${l===4?' · textos':''}</option>`).join('')}</select><button class="primary wide" data-action="mixed">Jugar una tanda mixta <span>→</span></button></aside></section><section class="blocks-section"><div class="section-intro"><div><span class="eyebrow">ELIGE TU INVESTIGACIÓN</span><h2>¿Qué practicamos hoy?</h2></div><button class="text-button" data-action="guide">Cómo se juega ↗</button></div><div class="block-grid">${BLOCKS.map((b,i)=>`<button class="block-card" style="--accent:${b.color}" data-action="block" data-id="${b.id}"><div class="block-top"><span class="block-icon">${esc(b.icon)}</span><span class="case-number">CASO ${String(i+1).padStart(2,'0')}</span></div><h3>${esc(b.title)}</h3><p>${esc(b.desc)}</p><div class="block-foot"><span>Elige entre 4 niveles</span><span class="circle-arrow">→</span></div></button>`).join('')}</div><p class="quiet-note"><span class="note-star">✦</span> Juego libre: al cerrar o recargar la página, la partida termina.</p></section>`;
}
function levelName(id,l){return id==='tildes'?['','La sílaba tónica','Tildes en palabras','Tildes en textos','Textos con más pistas'][l]:['','Con opciones','De memoria','Corrige palabras','Revisión de textos'][l];}
function levelDetail(id,l){return id==='tildes'?['','Clasifica una tanda de agudas, llanas y esdrújulas.','Edita las palabras y coloca las tildes. Comprueba todas a la vez.','Localiza las palabras que necesitan tilde y corrígelas.','Textos con hiatos, tildes diacríticas e interrogativos.'][l]:['','Completa palabras frecuentes eligiendo las letras.','Escribe las letras que faltan sin ver opciones.','Corrige palabras dentro de varias frases.','Encuentra los errores de un texto y repara las palabras.'][l];}
function renderBlock(){const b=byId(selectedBlock);if(!b){goHome();return;}$('#app').innerHTML=`<section class="block-page"><button class="back" data-action="home">← Todos los bloques</button><div class="block-title"><span class="large-icon" style="--accent:${b.color}">${esc(b.icon)}</span><div><span class="eyebrow">JUEGO LIBRE · ${esc(b.label)}</span><h1>${esc(b.title)}</h1><p>${esc(b.desc)}</p></div></div><div class="section-intro"><div><h2>Elige tu nivel</h2><p>Puedes jugar directamente en cualquiera.</p></div><button class="secondary" data-action="lesson" data-id="${b.id}">Ver las pistas</button></div><div class="levels-grid">${[1,2,3,4].map(l=>`<article class="level-card"><div class="level-meta"><span>NIVEL ${l}</span></div><h3>${levelName(b.id,l)}</h3><p>${esc(levelDetail(b.id,l))}</p><button class="primary wide" data-action="start" data-id="${b.id}" data-level="${l}">Jugar <span>→</span></button></article>`).join('')}</div></section>`;}
function poolFor(block,level){const pool=baseWordPool(block,level);return pool.map(q=>q.kind==='classify'?{...q,accentKind:WORD_INDEX[q.source].kind}:q);}
function chooseQuestions(block,level,count){const pool=shuffle(poolFor(block,level)),selected=pool.slice(0,count);if(level===1&&block!=='tildes')for(const option of byId(block).options){if(selected.some(q=>q.answer===option))continue;const candidate=pool.find(q=>q.answer===option);if(!candidate)continue;let replace=-1;for(let i=selected.length-1;i>=0;i--)if(selected.filter(x=>x.answer===selected[i].answer).length>1){replace=i;break;}if(replace>=0)selected[replace]=candidate;}return selected;}
function startNew(block,level,mixed=false){
let questions=[];const text=block==='tildes'?level>=3:level===4;
if(mixed){const order=shuffle(BLOCKS);const count=level===4?Math.max(2,Math.ceil(settings.rounds/4)):settings.rounds;for(let i=0;i<count;i++){const b=order[i%order.length],pool=shuffle(poolFor(b.id,level)).filter(q=>!questions.some(x=>x.id===q.id));if(pool[0])questions.push(pool[0]);}}
else questions=chooseQuestions(block,level,text?Math.max(2,Math.ceil(settings.rounds/3)):settings.rounds);
questions=questions.map(q=>({...q,state:{stage:'answer',selected:[],answer:q.kind==='accent'?stripAcute(q.word):['repair','spell'].includes(q.kind)?q.wrong||q.word:null,corrections:{},checked:false,fixed:false}}));
const pages=[];let group=[];const flush=()=>{if(group.length){pages.push({type:'words',indices:group});group=[];}};questions.forEach((q,i)=>{if(isText(q)){flush();pages.push({type:'text',indices:[i]});}else group.push(i);});flush();
session={block,level,mixed,questions,pages,page:0,index:pages[0].indices[0],correct:0,total:0};screen='play';render();window.scrollTo(0,0);
}
function currentPage(){return session.pages[session.page];}
function qNow(){return session.questions[session.index];}
function pageStatus(){const p=currentPage();if(p.type==='text'){const q=qNow(),s=q.state;return{checked:!!s.checked,allFixed:!!s.checked&&q.targets.every(t=>s.fixResults?.[t.index])};}const qs=p.indices.map(i=>session.questions[i]);return{checked:qs.every(q=>q.state.checked),allFixed:qs.every(q=>q.state.checked&&q.state.fixed)};}
function summary(){const qs=currentPage().indices.map(i=>session.questions[i]);if(!qs.every(q=>q.state.checked))return'';const c=qs.reduce((n,q)=>n+q.state.correct,0),t=qs.reduce((n,q)=>n+q.state.total,0),done=pageStatus().allFixed;return`<div class="batch-summary ${done?'all-done':''}" role="status"><strong>Primer intento: ${c}/${t}</strong><span>${done?'Toda la tanda revisada. ¡Buen trabajo!':'Corrige las rojas. Puedes abrir su explicación si la necesitas.'}</span></div>`;}
function toolbar(){const p=currentPage(),q=qNow(),s=pageStatus();if(p.type==='text'&&q.state.stage==='answer')return'<span class="answer-note">Puedes marcar y desmarcar antes de seguir.</span><button class="primary" data-action="prepare-text">Preparar corrección →</button>';if(!s.checked)return'<span class="answer-note">Una sola comprobación para toda esta pantalla.</span><button class="primary" data-action="check">Comprobar toda la tanda ✓</button>';if(!s.allFixed)return'<span class="answer-note">Revisa las respuestas rojas y compruébalas juntas.</span><div class="toolbar-buttons"><button class="primary" data-action="check">Comprobar correcciones ✓</button><button class="text-button" data-action="finish">Terminar tanda</button></div>';return`<span class="batch-done">✓ Todas las palabras revisadas</span><div class="toolbar-buttons">${session.page+1<session.pages.length?'<button class="primary" data-action="next">Siguiente pantalla →</button>':'<button class="primary" data-action="again">Otra tanda del mismo nivel →</button>'}<button class="secondary" data-action="finish">Ver resultado</button></div>`;}
function renderPlay(){const p=currentPage(),q=qNow();const allAccent=p.type==='words'&&p.indices.every(i=>session.questions[i].kind==='accent');$('#app').innerHTML=`<section class="batch-page"><div class="play-top"><button class="back" data-action="home">← Volver a los bloques</button><div class="play-tools"><span class="block-tag">${session.mixed?'Tanda mixta':esc(byId(session.block).title)} · Nivel ${session.level}</span>${!session.mixed?`<button class="text-button" data-action="lesson" data-id="${session.block}">Pistas del bloque</button>`:''}</div></div><div class="batch-page-heading"><div><span class="eyebrow">JUEGO LIBRE · ESCRIBE · COMPRUEBA · REVISA</span><h1 id="exercise-title">${esc(p.type==='text'?q.title:allAccent?'Una tanda de tildes':'Todas las palabras, una tanda')}</h1><p>${p.type==='text'?q.state.stage==='answer'?(q.kind==='accent-text'?'Marca las palabras que necesitan tilde. Después podrás escribirlas correctamente.':'Marca las palabras mal escritas y después corrígelas.'):'Edita las palabras y comprueba toda la tanda.':allAccent?'Escribe las palabras con sus tildes. También puedes tocar las vocales.':'Resuelve todas las palabras y comprueba la tanda de una vez.'}</p></div><span class="sheet-count">${session.page+1}/${session.pages.length}<small>pantallas</small></span></div>${p.type==='text'?newTextHTML(q):'<div class="batch-grid">'+p.indices.map((i,n)=>wordCard(session.questions[i],i,n+1)).join('')+'</div>'}${summary()}<div class="batch-tools"><span>Teclas de apoyo:</span>${['á','é','í','ó','ú','ü','ñ'].map(c=>`<button data-action="special" data-value="${c}">${c}</button>`).join('')}<small>Selecciona una letra del recuadro para sustituirla.</small></div><div class="batch-toolbar">${toolbar()}</div></section>`;}
function refData(ref){const m=String(ref).match(/^([wt])-(\d+)$/);if(!m||!session)return null;const i=Number(m[2]);if(m[1]==='w'){const q=session.questions[i];return q?{q,state:q.state,index:i,text:false}:null;}const q=qNow(),target=q.targets.find(t=>t.index===i);return target?{q,state:q.state,index:i,target,text:true}:null;}
function refValue(ref){const d=refData(ref);return d?(d.text?d.state.corrections[d.index]??d.target.wrong:d.state.answer??''):'';}
function setRefValue(ref,value,typed=false){const d=refData(ref);if(!d)return;if(d.text)d.state.corrections[d.index]=value;else{d.state.answer=value;if(d.q.kind==='fill'&&(typed||String(value).length))d.state.noH=false;}}
function syncInputs(){document.querySelectorAll('[data-batch-input]').forEach(input=>{if(!input.disabled)setRefValue(input.dataset.batchInput,input.value);});}
function check(){syncInputs();const p=currentPage();if(p.type==='text'){checkText();return;}const qs=p.indices.map(i=>session.questions[i]),missing=qs.find(q=>!answerComplete(q));if(missing){toast('Completa todas las respuestas antes de comprobar.');$('#batch-w-'+session.questions.indexOf(missing))?.focus();return;}for(const q of qs){const s=q.state,ok=correctWord(q);if(!s.checked){s.correct=ok?1:0;s.total=1;session.correct+=s.correct;session.total++;s.checked=true;}s.fixed=ok;}renderPlay();$('.batch-summary')?.scrollIntoView({block:'nearest',behavior:'smooth'});}
function prepareText(){const q=qNow(),s=q.state;s.firstSelected=[...s.selected];s.stage='repair';for(const t of q.targets)s.corrections[t.index]=t.wrong;renderPlay();}
function checkText(){const q=qNow(),s=q.state;if(s.stage==='answer'){prepareText();return;}if(q.targets.some(t=>!String(s.corrections[t.index]??'').trim())){toast('Completa las palabras antes de comprobar.');return;}const first=!s.checked;s.fixResults={};if(first){s.correct=0;s.total=0;}for(const t of q.targets){const ok=lower(s.corrections[t.index]??t.wrong)===lower(t.correct);s.fixResults[t.index]=ok;if(first){s.correct+=ok&&s.firstSelected.includes(t.index)?1:0;s.total++;}}if(first){const ids=new Set(q.targets.map(t=>t.index));s.total+=s.firstSelected.filter(i=>!ids.has(i)).length;session.correct+=s.correct;session.total+=s.total;s.checked=true;}renderPlay();$('.batch-summary')?.scrollIntoView({block:'nearest',behavior:'smooth'});}
function next(){if(!pageStatus().checked)return;if(session.page+1<session.pages.length){session.page++;session.index=currentPage().indices[0];renderPlay();window.scrollTo(0,0);}else finish();}
function finish(){if(!session.total){toast('Comprueba una tanda antes de ver el resultado.');return;}screen='result';render();window.scrollTo(0,0);}
function again(){startNew(session.block,session.level,session.mixed);}
function renderResult(){$('#app').innerHTML=`<section class="result-page"><div class="result-seal">${ICON}</div><span class="eyebrow">TANDA TERMINADA</span><h1>¡Una buena<br>tanda de <em>pistas!</em></h1><div class="result-stats free-result"><div><strong>${session.correct}/${session.total}</strong><span>Aciertos en el primer intento</span></div><div><strong>${session.questions.filter(q=>q.state.checked).length}</strong><span>Actividades comprobadas</span></div></div><p>Elige otra tanda del mismo nivel o cambia de bloque.</p><div class="result-actions"><button class="primary" data-action="again">Otra tanda →</button><button class="secondary" data-action="home">Elegir bloque y nivel</button></div></section>`;}
function modal(title,body){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;if(!$('#dialog').open)$('#dialog').showModal();}
function closeModal(){$('#dialog').close();}
function lesson(id){modal('Pistas · '+byId(id).title,'<div class="lesson-list">'+LESSONS[id].map(([t,p])=>'<div><h3>'+esc(t)+'</h3><p>'+esc(p)+'</p></div>').join('')+'</div><button class="primary" data-action="close-modal">Seguir jugando →</button>');}
function explain(word,rule,category){modal('La pista de esta palabra',`<div class="word-explanation"><span class="eyebrow">REVISA Y VUELVE A PROBAR</span><p class="explanation-answer">${esc(word)}</p><p>${esc(rule)}</p>${category?'<p>Es una palabra <strong>'+esc(category.toLowerCase())+'</strong>.</p>':''}</div><button class="primary" data-action="close-modal">Volver a la tanda →</button>`);}
function guide(){modal('Cómo jugar',`<div class="lesson-list"><div><h3>Elige bloque y nivel</h3><p>Hay nueve bloques y cuatro dificultades. Tú decides dónde practicar. También puedes elegir una tanda mixta.</p></div><div><h3>Una comprobación para todas</h3><p>Completa la tanda y pulsa «Comprobar toda la tanda». Las correctas quedan en verde y las rojas se pueden corregir. Abre «Ver explicación» cuando la necesites.</p></div><div><h3>Las tildes</h3><p>En Acentuación, nivel 2, escribe las palabras con el teclado o toca las vocales para poner y quitar sus tildes. Compruébalas todas juntas.</p></div><div><h3>Una partida nueva cada vez</h3><p>Esta versión es de juego libre, sin perfiles ni archivos de avance. Al recargar o cerrar la página se empieza de cero.</p></div></div><button class="primary" data-action="close-modal">Entendido</button>`);}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('visible'),3500);}
function downloadApp(){const doc=new DOMParser().parseFromString('<!DOCTYPE html>\n'+document.documentElement.outerHTML,'text/html');doc.querySelector('#app').innerHTML='';doc.querySelector('#modal-body').innerHTML='';doc.querySelector('#dialog').removeAttribute('open');doc.querySelector('#toast').textContent='';doc.querySelector('#toast').classList.remove('visible');const url=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+doc.documentElement.outerHTML],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Detectives_ortografia_juego_libre.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('Puedes ampliar el juego con la pantalla completa de tu navegador.');}}
document.addEventListener('click',e=>{
const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
if(a==='home'){closeModal();goHome();return;}if(a==='guide'){guide();return;}if(a==='lesson'){lesson(b.dataset.id);return;}if(a==='close-modal'){closeModal();return;}if(a==='download-app'){downloadApp();return;}if(a==='fullscreen'){fullscreen();return;}
if(a==='block'){selectedBlock=b.dataset.id;session=null;screen='block';render();window.scrollTo(0,0);return;}if(a==='start'){startNew(b.dataset.id,Number(b.dataset.level));return;}if(a==='mixed'){startNew('mixed',settings.mixedLevel,true);return;}if(!session||screen!=='play'&&a!=='again')return;
if(a==='check'){check();return;}if(a==='finish'){finish();return;}if(a==='next'){next();return;}if(a==='again'){again();return;}if(a==='prepare-text'){prepareText();return;}
if(a==='batch-choice'){const q=session.questions[Number(b.dataset.q)];q.state.answer=b.dataset.value;renderPlay();return;}
if(a==='batch-no-h'){const s=session.questions[Number(b.dataset.q)].state;s.answer='';s.noH=true;renderPlay();return;}
if(a==='text-select'){const s=qNow().state,i=Number(b.dataset.index);s.selected=s.selected.includes(i)?s.selected.filter(x=>x!==i):[...s.selected,i];renderPlay();return;}
if(a==='clear-selection'){qNow().state.selected=[];renderPlay();return;}
if(a==='word-hint'){const q=session.questions[Number(b.dataset.q)];explain(q.word,q.rule,q.accentKind);return;}
if(a==='text-word-hint'){const t=qNow().targets.find(t=>t.index===Number(b.dataset.target));if(t)explain(t.correct,t.rule);return;}
if(a==='batch-vowel'){syncInputs();const ref=b.dataset.ref,value=refValue(ref),i=Number(b.dataset.letter),c=value[i];if(!c)return;setRefValue(ref,value.slice(0,i)+(acute(c)?stripAcute(c):addAcute(c))+value.slice(i+1));renderPlay();return;}
if(a==='special'){const ref=document.activeElement?.dataset?.batchInput||lastRef,input=ref?$('#batch-'+ref):null;if(!input||input.disabled||input.tagName==='SELECT'){toast('Selecciona una letra en una palabra para sustituirla.');return;}let start=input.selectionStart??input.value.length,end=input.selectionEnd??start;const c=b.dataset.value;if(start===end&&start>0&&stripAcute(input.value[start-1])===stripAcute(c))start--;input.value=input.value.slice(0,start)+c+input.value.slice(end);setRefValue(ref,input.value,true);input.focus();input.setSelectionRange(start+1,start+1);updateQuick(ref,input.value);}
});
function updateQuick(ref,value){const el=document.querySelector('[data-quick-ref="'+ref+'"]');if(el)el.outerHTML=quickVowels(ref,value,false);}
document.addEventListener('focusin',e=>{if(e.target.dataset?.batchInput)lastRef=e.target.dataset.batchInput;});
document.addEventListener('input',e=>{const ref=e.target.dataset?.batchInput;if(!ref)return;setRefValue(ref,e.target.value,true);if(refData(ref)?.q.kind==='accent'||refData(ref)?.text&&refData(ref)?.q.kind==='accent-text')updateQuick(ref,e.target.value);});
document.addEventListener('change',e=>{if(e.target.dataset?.batchInput)setRefValue(e.target.dataset.batchInput,e.target.value,true);if(e.target.dataset?.setting){const key=e.target.dataset.setting,n=Number(e.target.value);if(key==='rounds'&&[6,10,15].includes(n)||key==='mixedLevel'&&[1,2,3,4].includes(n))settings[key]=n;}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.dataset?.batchInput||$('#dialog').open)return;e.preventDefault();const inputs=[...document.querySelectorAll('[data-batch-input]:not(:disabled)')],i=inputs.indexOf(e.target);if(inputs[i+1])inputs[i+1].focus();else document.querySelector('[data-action="check"]')?.focus();});
render();
</script></body></html>
